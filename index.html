<style>
:root{
  --paper:#E8F7F1; --card:#FFFFFF; --ink:#4A2C3D; --ink2:#7A5C6B; --edge:#4A2C3D; --line:#F3DEE6; --tile:#FFF0F4;
  --sea:#FF86AB; --on-sea:#4A2C3D; --stamp:#CF2F5A; --leaf:#11835E; --sun:#FFD86B; --sun-soft:#FFF4C9;
  --pass:#FFA9C3; --on-pass:#4A2C3D; --on-pass2:#7A4660;
  --font:"Chiron GoRound TC","Yuanti TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#231A26; --card:#33263A; --ink:#FBEAF1; --ink2:#C9AFBE; --edge:#120B13; --line:#4A3950; --tile:#40304A;
    --sea:#FF8FB0; --on-sea:#2A1420; --stamp:#FF8FA8; --leaf:#6FDDB4; --sun:#FFD86B; --sun-soft:#4D4020;
    --pass:#FF9DBA; --on-pass:#2A1420; --on-pass2:#6A3C52;
  }
}
:root[data-theme="dark"]{
  --paper:#231A26; --card:#33263A; --ink:#FBEAF1; --ink2:#C9AFBE; --edge:#120B13; --line:#4A3950; --tile:#40304A;
  --sea:#FF8FB0; --on-sea:#2A1420; --stamp:#FF8FA8; --leaf:#6FDDB4; --sun:#FFD86B; --sun-soft:#4D4020;
  --pass:#FF9DBA; --on-pass:#2A1420; --on-pass2:#6A3C52;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid #5AA9FF;outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;overflow-x:clip}
.boot{padding:40vh 24px 0;text-align:center;color:var(--ink2);font-weight:700}
.mascot{display:block;flex:none}

/* ---------- buttons: stickers you can press ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:900;background:var(--sea);color:var(--on-sea);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.block{display:flex;width:100%}
.btn{white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.danger{background:var(--card);color:var(--stamp)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;box-shadow:0 3px 0 var(--edge)}
.btn.small:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg,.icon-btn svg,.pill-btn svg{width:20px;height:20px;flex:none}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:inherit}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;font-weight:900;font-size:14px;background:var(--sun);color:#4A2C3D;border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.pill-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.link{color:var(--stamp);font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn,.pill-btn{transition:none}}

/* ---------- login ---------- */
.login{padding:10vh 20px 40px}
.ticket{background:var(--pass);color:var(--on-pass);border-radius:28px;overflow:hidden;border:2px solid var(--edge);box-shadow:0 6px 0 var(--edge)}
.ticket-main{padding:28px 26px 26px}
.ticket-main .mascot{margin:0 0 6px -8px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.ticket-main .mascot{animation:none}}
.ticket-main h1{font-size:54px;font-weight:900;letter-spacing:.06em;line-height:1.1}
.ticket-main p{margin-top:12px;font-size:17px;font-weight:500;color:var(--on-pass2);max-width:17em}
.perf{position:relative;border-top:3px dotted var(--edge);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--edge)}
.perf::before{left:-33px}.perf::after{right:-33px}
.ticket-stub{padding:22px 26px 28px;display:grid;gap:14px}
.ticket-stub .btn{background:#fff;color:#4A2C3D}
.ticket-stub small{color:var(--on-pass2);font-size:14px;font-weight:500}
.gmark{width:20px;height:20px}

/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0}
.brand{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:22px;letter-spacing:.08em}
.home{padding:8px 20px 40px}
.home h1{font-size:30px;font-weight:900;margin:16px 0 16px}
.banner{background:var(--sun-soft);border:2px dashed var(--edge);border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:6px}
.banner b{font-weight:900}
.trip{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);border-radius:22px;padding:16px 18px;margin-bottom:16px;transition:transform .08s,box-shadow .08s}
.trip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.trip-main{flex:1;min-width:0}
.trip-main b{display:block;font-size:19px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-main small{color:var(--ink2);font-size:14px}
.stack{display:flex}
.stack .av{margin-left:-8px}
.stack .av:first-child{margin-left:0}
.empty{padding:26px 8px 30px;color:var(--ink2);text-align:center}
.empty .mascot{margin:0 auto 6px}
.empty b{display:block;color:var(--ink);font-size:19px;font-weight:900;margin-bottom:4px}

/* ---------- avatar ---------- */
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:900;font-size:15px;color:#4A2C3D;flex:none;overflow:hidden;background:#9FE3CF;border:2px solid var(--edge)}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:28px;height:28px;font-size:12px}
.h0{background:#9FE3CF}.h1{background:#FFA9C3}.h2{background:#FFD86B}.h3{background:#C9B2FF}.h4{background:#A9D8FF}.h5{background:#FFC59A}

/* ---------- group: ticket header ---------- */
.pass{background:var(--pass);color:var(--on-pass);border-radius:0 0 28px 28px;padding:8px 12px 0;overflow:hidden;border:2px solid var(--edge);border-top:0;box-shadow:0 5px 0 var(--edge)}
.pass .perf{margin:0 6px}
.pass-top{display:flex;align-items:center;gap:6px;padding-bottom:12px}
.pass-title{flex:1;min-width:0}
.pass-title h1{font-size:22px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pass-title p{font-size:13px;font-weight:500;color:var(--on-pass2)}
.pass-stub{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 10px 16px}
.pass-stub span{display:block;font-size:13px;font-weight:700;color:var(--on-pass2)}
.pass-stub b{font-size:21px;font-weight:900}
.pass-stub b.pos{color:#0A5C41}.pass-stub b.neg{color:#A3123C}

.body{padding:22px 16px 110px}
.body.list{padding-bottom:200px}
.day{font-size:14px;font-weight:900;color:var(--ink2);margin:20px 8px 8px}
.day:first-child{margin-top:0}
.rows{background:var(--card);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-top:2px dotted var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--tile)}
.seal{--c:#FFD86B;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 30%,var(--card))}
.seal svg,.ci svg{width:26px;height:26px;display:block}
.c-food{--c:#FFB37A}.c-transit{--c:#8CCBFF}.c-stay{--c:#C9B2FF}.c-shop{--c:#FF9DB8}.c-fun{--c:#9BE3A8}.c-other{--c:#FFD86B}.c-pay{--c:#FF86AB}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main small,.row-amt small{display:block;color:var(--ink2);font-size:13px}
.row-amt{text-align:right;flex:none}
.row-amt b{font-weight:900;font-size:17px}
.clip{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:4px;color:var(--ink2)}

/* dock + tabs */
.dock{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none}
.dock-in{max-width:560px;margin:0 auto;padding:12px 16px 14px;display:flex;gap:10px;pointer-events:auto;background:linear-gradient(to top,var(--paper) 72%,transparent)}
.dock .btn{flex:1;min-height:58px;font-size:18px}
.dock .btn.ghost{flex:none;width:64px;padding:0;border-radius:22px;flex-direction:column;gap:0;font-size:12px;font-weight:900}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:2px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px}
.tab{height:60px;display:grid;place-items:center;font-weight:900;color:var(--ink2);position:relative;z-index:0;text-align:center}
.tab[aria-current="true"]{color:#4A2C3D}
.tab[aria-current="true"]::before{content:"";position:absolute;z-index:-1;inset:11px 12%;background:var(--sun);border:2px solid var(--edge);border-radius:999px}

/* panels */
.panel{background:var(--card);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);border-radius:22px;padding:16px;margin-bottom:18px}
.panel h2{font-size:17px;font-weight:900;margin-bottom:12px}
.panel .hint{color:var(--ink2);font-size:13px;margin-top:12px}
.pay{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:2px dotted var(--line)}
.pay:first-of-type{border-top:0;padding-top:0}
.pay-main{flex:1;min-width:0;font-weight:700}
.pay-main small{display:block;font-weight:500;color:var(--ink2);font-size:13px}
.pay-main .amt{font-weight:900;font-size:18px;color:var(--ink)}
.ok{display:inline-block;font-size:12px;font-weight:900;background:#D9F3EA;color:#0A5C41;border:1.5px solid var(--edge);border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:2px;line-height:1.5}
.pay.done .av{opacity:.6}
.allclear{font-weight:900;color:var(--leaf);margin-top:12px}
.track{display:block;background:var(--tile);border:2px solid var(--edge);border-radius:999px;overflow:hidden}
.fill{display:block}
.net{display:grid;grid-template-columns:4.6em minmax(0,1fr) 8.4em;align-items:center;gap:8px;padding:8px 0;font-size:14px}
.net .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.net .track{height:18px;position:relative}
.net .track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--edge)}
.net .fill{position:absolute;top:0;bottom:0}
.net .fill.pos{left:50%;background:#7FDDB8}
.net .fill.neg{right:50%;background:#FF9DB8}
.net .v{text-align:right;font-weight:900}
.net .v small{display:block;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.net .v small.ok{display:table;margin:3px 0 0 auto}
.net.settled .fill{opacity:.45}
.pos{color:var(--leaf)}.neg{color:var(--stamp)}
.figs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.6fr);gap:10px;margin-bottom:18px}
.fig{background:var(--card);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);border-radius:18px;padding:10px 12px;min-width:0}
.fig:nth-child(1){background:#FFE3EC}.fig:nth-child(2){background:#D9F3EA}.fig:nth-child(3){background:#FFF1BF}
.fig span{display:block;font-size:13px;font-weight:700;color:#7A5C6B}
.fig b{font-size:clamp(15px,4.4vw,19px);font-weight:900;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4A2C3D}
.bar{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.bar .track{height:16px}
.bar .fill{height:100%;background:var(--c,var(--sea));border-right:2px solid var(--edge)}
.bar .v{font-weight:900}
.bar .seal{width:34px;height:34px;border-radius:11px}
.bar .seal svg{width:22px;height:22px}
.cols{display:flex;align-items:flex-end;gap:8px;height:140px;overflow-x:auto;padding-top:6px}
.col{flex:1 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--ink2);font-weight:700}
.col i{display:block;width:100%;max-width:40px;background:var(--sea);border:2px solid var(--edge);border-radius:10px 10px 4px 4px;min-height:8px}
.col:nth-child(3n+2) i{background:#9FE3CF}.col:nth-child(3n) i{background:var(--sun)}
.col em{font-style:normal;font-weight:900;color:var(--ink);font-size:11px}
.duo{padding:8px 0;border-top:2px dotted var(--line);font-size:14px}
.duo:first-of-type{border-top:0}
.duo .nm{font-weight:900;margin-bottom:4px}
.duo .l{display:grid;grid-template-columns:3.2em 1fr 6.5em;gap:8px;align-items:center;color:var(--ink2);font-size:13px;margin-bottom:3px}
.duo .track{height:14px}
.duo .fill{height:100%;background:var(--sea);border-right:2px solid var(--edge)}
.duo .fill.b{background:var(--sun)}
.duo .v{text-align:right;font-weight:900;color:var(--ink)}
.mem{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dotted var(--line)}
.mem:first-of-type{border-top:0}
.mem-main{flex:1;min-width:0;font-weight:700}
.mem-main small{display:block;color:var(--ink2);font-weight:500;font-size:13px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn-row .btn{flex:1}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(58,30,46,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));background:var(--card);border-radius:4px 4px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet::before{content:"";position:absolute;top:-9px;left:0;right:0;height:10px;background:linear-gradient(135deg,transparent 50%,var(--card) 50%),linear-gradient(225deg,transparent 50%,var(--card) 50%);background-size:14px 10px;background-repeat:repeat-x}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px 20px}
.sheet-head h2{font-size:21px;font-weight:900}
.sheet-head .icon-btn{background:var(--tile);border:2px solid var(--edge);width:40px;height:40px;margin-right:8px}
.sheet-body{padding:8px 20px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px dotted var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.danger{flex:none}
.field{margin-bottom:16px}
.field>label,.field>.lab{display:block;font-size:14px;font-weight:900;margin-bottom:6px}
.field .tag{display:none;font-size:11px;font-weight:900;background:var(--sun);color:#4A2C3D;border:1.5px solid var(--edge);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.field.ai .tag{display:inline-block}
.inp{width:100%;min-height:48px;border-radius:16px;border:2px solid var(--edge);background:var(--card);padding:0 14px;font-weight:500}
.inp::placeholder{color:var(--ink2);opacity:.7}
.inp:focus{outline:none;box-shadow:0 0 0 3px #A9D8FF}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 19px) 21px,calc(100% - 13px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
input[type=date].inp{-webkit-appearance:none;appearance:none;min-width:0}
.field.ai .inp{background-color:var(--sun-soft)}
.inp.big{font-size:26px;font-weight:900;min-height:58px;border-radius:18px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.conv{font-size:14px;color:var(--ink2);margin:-6px 0 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.conv b{color:var(--ink);font-weight:900}
.conv input{width:6.5em;min-height:34px;border-radius:12px;border:2px solid var(--edge);background:var(--card);padding:0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px 0 6px;border-radius:999px;border:2px solid var(--edge);background:var(--card);font-weight:700;font-size:14px}
.chip.cat{padding:0 14px 0 8px}
.chip[aria-pressed="true"]{background:var(--sun);color:#4A2C3D;box-shadow:0 3px 0 var(--edge);font-weight:900}
.chip .av{border-width:1.5px}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--tile);border:2px solid var(--edge);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{min-height:34px;padding:0 16px;border-radius:999px;font-weight:900;font-size:14px;text-align:center;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--on-sea);box-shadow:inset 0 0 0 2px var(--edge)}
.share{display:grid;grid-template-columns:1fr 8em;gap:10px;align-items:center;margin-bottom:8px}
.share span{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.share .inp{min-height:42px;text-align:right}
.sub{font-size:13px;color:var(--ink2);margin-top:8px}
.sub.bad{color:var(--stamp);font-weight:900}
.scan{display:flex;gap:12px;align-items:center;background:var(--tile);border:2px dashed var(--edge);border-radius:20px;padding:10px;margin-bottom:16px}
.scan img{width:64px;height:84px;object-fit:cover;border-radius:12px;border:2px solid var(--edge);background:var(--card);flex:none;display:block}
.scan-main{flex:1;min-width:0;font-size:14px}
.scan-main b{display:block;font-weight:900}
.scan-main .acts{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"．"}50%{content:"．．"}75%{content:"．．．"}}
.err{color:var(--stamp);font-weight:900;font-size:14px;margin-bottom:10px}
.qr{background:#fff;border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);border-radius:20px;padding:12px;width:208px;margin:6px auto 18px}
.qr svg{display:block;width:180px;height:180px}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px}
.viewer img{max-width:100%;max-height:100%;border-radius:12px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:#4A2C3D;color:#fff;border:2px solid #fff;padding:9px 18px;border-radius:999px;font-weight:900;font-size:14px;max-width:86vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.item{display:grid;grid-template-columns:minmax(0,1fr) 6.5em 36px;gap:8px;align-items:start;margin-bottom:8px}
.item .inp{min-height:42px;border-radius:14px}
.item .inp.num{text-align:right}
.item small{display:block;color:var(--ink2);font-size:12px;margin:3px 4px 0;overflow-wrap:anywhere}
.item .icon-btn{width:36px;height:42px;color:var(--ink2)}
#print{display:none}
#pdfstage{position:absolute;left:-10000px;top:0;width:714px}
.report{font-size:10.5pt;line-height:1.45;color:#111;background:#fff;font-weight:400}
.report h1{font-size:20pt;font-weight:900;margin:0 0 2pt}
.report h2{font-size:12.5pt;font-weight:900;margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:1.5pt solid #111;break-after:avoid}
.report p{margin:0}
.report .meta{color:#444}
.report table{width:100%;border-collapse:collapse;font-size:9.5pt}
.report th,.report td{border-bottom:.5pt solid #bbb;padding:4pt 5pt;text-align:left;vertical-align:top}
.report th{font-weight:700;border-bottom:1pt solid #111}
.report .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.report tr{break-inside:avoid}
.report .its{color:#444;font-size:8.5pt;margin-top:2pt}
.report .kpi{display:flex;gap:18pt;flex-wrap:wrap;margin-top:8pt}
.report .kpi div{min-width:90pt}
.report .kpi span{display:block;color:#444;font-size:9pt}
.report .kpi b{font-size:14pt;font-weight:800}
.report tfoot td{font-weight:800;border-bottom:0;border-top:1pt solid #111}
.report .rb{width:120px;height:9px;background:#e4e4e4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.report .rb i{display:block;height:9px;background:#FF86AB;-webkit-print-color-adjust:exact;print-color-adjust:exact}
a.btn{text-decoration:none}
@media print{
  :root{padding:0}
  html,body{background:#fff!important;color:#111!important}
  #app,#sheet,#toast,.viewer,#pdfstage{display:none!important}
  #print{display:block}
  @page{margin:14mm}
}

/* =====================================================================
   資料層：cloud（Firebase）與 demo（本機）共用同一組介面
   ===================================================================== */
async function cloudStore() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [A, U, Fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = A.initializeApp(firebaseConfig);
  if (RECAPTCHA_ENTERPRISE_SITE_KEY) {
    try { const C = await import(base + 'firebase-app-check.js'); C.initializeAppCheck(app, { provider: new C.ReCaptchaEnterpriseProvider(RECAPTCHA_ENTERPRISE_SITE_KEY), isTokenAutoRefreshEnabled: true }); }
    catch (e) { console.warn('App Check 初始化失敗', e); }
  }
  const auth = U.getAuth(app);
  let db;
  try { db = Fs.initializeFirestore(app, { localCache: Fs.persistentLocalCache({ tabManager: Fs.persistentMultipleTabManager() }) }); }
  catch { db = Fs.getFirestore(app); }
  const gref = gid => Fs.doc(db, 'groups', gid);
  const fail = what => e => { console.error(what, e); toast(e?.code === 'permission-denied' ? `${what}被拒絕（沒有權限）` : `${what}沒有成功（${e?.code || '連線問題'}）`); };
  let model;
  const me = () => auth.currentUser?.uid;
  return {
    mode: 'cloud',
    onUser(cb) { U.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, name: u.displayName || (u.email || '').split('@')[0] || '旅伴', photo: u.photoURL || '', email: u.email || '' } : null)); },
    async signIn() {
      const p = new U.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      try { await U.signInWithPopup(auth, p); }
      catch (e) { if (/popup-blocked|operation-not-supported/.test(e?.code || '')) await U.signInWithRedirect(auth, p); else if (!/popup-closed|cancelled/.test(e?.code || '')) throw e; }
    },
    // 登出時把這台裝置上的離線快取一併清掉，避免共用電腦或借來的手機留下行程資料
    async signOut() { await U.signOut(auth); try { await Fs.terminate(db); await Fs.clearIndexedDbPersistence(db); } catch (e) { console.warn('清除離線快取失敗', e); } location.reload(); },
    watchGroups: cb => Fs.onSnapshot(Fs.query(Fs.collection(db, 'groups'), Fs.where('memberUids', 'array-contains', me())), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), fail('讀取行程列表')),
    watchGroup: (gid, cb) => Fs.onSnapshot(gref(gid), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), e => { console.warn('讀取行程', e); cb(null, e); }),
    watchExpenses: (gid, cb) => Fs.onSnapshot(Fs.collection(db, 'groups', gid, 'expenses'), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), fail('讀取帳目')),
    async createGroup(data) { const r = Fs.doc(Fs.collection(db, 'groups')); await Fs.setDoc(r, data); return r.id; },
    updateGroup: (gid, patch) => Fs.updateDoc(gref(gid), patch).catch(fail('更新行程')),
    setMember: (gid, id, m) => Fs.updateDoc(gref(gid), { ['members.' + id]: m }).catch(fail('新增成員')),
    removeMember: (gid, id) => Fs.updateDoc(gref(gid), { ['members.' + id]: Fs.deleteField() }).catch(fail('移除成員')),
    // 舊版曾把 e-mail 存進行程資料，這裡把它們刪掉（行程成員都讀得到這份資料）
    scrubEmails: (gid, ids) => Fs.updateDoc(gref(gid), Object.fromEntries(ids.map(id => ['members.' + id + '.email', Fs.deleteField()]))).catch(e => console.warn('清除 e-mail 失敗', e)),
    joinGroup: (gid, code, m) => Fs.updateDoc(gref(gid), { memberUids: Fs.arrayUnion(me()), ['members.' + me()]: m, joinedWith: code }),
    leaveGroup: gid => Fs.updateDoc(gref(gid), { memberUids: Fs.arrayRemove(me()), ['members.' + me() + '.left']: true }).catch(fail('退出行程')),
    // 建立者移出成員：收回存取權並換掉邀請碼。wipe = 沒有任何帳目，名字整個清掉；否則保留名字、標成已移出。
    kickMember: (gid, uid, wipe, code) => Fs.updateDoc(gref(gid), { memberUids: Fs.arrayRemove(uid), inviteCode: code,
      ...(wipe ? { ['members.' + uid]: Fs.deleteField() } : { ['members.' + uid + '.left']: true, ['members.' + uid + '.removed']: true }) }),
    async deleteGroup(gid) {
      for (const sub of ['expenses', 'receipts']) { const s = await Fs.getDocs(Fs.collection(db, 'groups', gid, sub)); await Promise.all(s.docs.map(d => Fs.deleteDoc(d.ref))); }
      await Fs.deleteDoc(gref(gid));
    },
    saveExpense(gid, id, data, receipt) {
      const r = id ? Fs.doc(db, 'groups', gid, 'expenses', id) : Fs.doc(Fs.collection(db, 'groups', gid, 'expenses'));
      Fs.setDoc(r, data).catch(fail('儲存帳目'));
      const rr = Fs.doc(db, 'groups', gid, 'receipts', r.id);
      if (receipt) Fs.setDoc(rr, { img: receipt, at: Date.now() }).catch(fail('儲存收據照片')); else if (receipt === null) Fs.deleteDoc(rr).catch(() => { });
      return r.id;
    },
    deleteExpense(gid, id) { Fs.deleteDoc(Fs.doc(db, 'groups', gid, 'expenses', id)).catch(fail('刪除帳目')); Fs.deleteDoc(Fs.doc(db, 'groups', gid, 'receipts', id)).catch(() => { }); },
    async getReceipt(gid, id) { const s = await Fs.getDoc(Fs.doc(db, 'groups', gid, 'receipts', id)); return s.exists() ? s.data().img : null; },
    async recognize(prompt, b64) {
      if (!model) { const G = await import(base + 'firebase-ai.js'); const ai = G.getAI(app, { backend: new G.GoogleAIBackend() }); model = G.getGenerativeModel(ai, { model: GEMINI_MODEL, generationConfig: { responseMimeType: 'application/json' } }); }
      const res = await model.generateContent([prompt, { inlineData: { data: b64, mimeType: 'image/jpeg' } }]);
      return parseJson(res.response.text());
    }
  };
}

    async kickMember(gid, uid, wipe, code) { const d = L.groups[gid].doc; d.memberUids = d.memberUids.filter(x => x !== uid); d.inviteCode = code; if (wipe) delete d.members[uid]; else Object.assign(d.members[uid], { left: true, removed: true }); save(); },
    async deleteGroup(gid) { delete L.groups[gid]; save(); },
    saveExpense(gid, id, data, receipt) { id = id || rid(); const g = L.groups[gid]; g.expenses[id] = data; if (receipt) g.receipts[id] = receipt; else if (receipt === null) delete g.receipts[id]; save(); return id; },
    deleteExpense(gid, id) { const g = L.groups[gid]; delete g.expenses[id]; delete g.receipts[id]; save(); },
    async getReceipt(gid, id) { return L.groups[gid]?.receipts?.[id] || null; },
    async recognize(prompt, b64, blob) {
      // 試用模式：在 Claude 發佈的頁面裡借用 Claude 辨識；其他環境沒有 AI。
      const sample = window.claude?.use ? await window.claude.use('sample') : null;
      const caps = sample ? await sample.limits().catch(() => null) : null;
      if (!caps?.images) throw Object.assign(new Error('no-ai'), { code: 'no-ai' });

}

function parseJson(t) {
  t = String(t || '').replace(/```json|```/g, '').trim();
  try { return JSON.parse(t); } catch { }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new Error('bad-json');
}

/* =====================================================================
   狀態與計算
   ===================================================================== */
const S = { ready: false, user: null, groups: [], gid: null, group: null, expenses: [], tab: 'list', loginErr: '' };
let store, unsubGroups, unsubGroup, unsubExp;
const scrubbed = new Set();
let sheet = null;   // { type, ... }
let F = null;       // 目前編輯中的帳目表單

// 從資料庫讀進來的資料一律先整理成固定型別再使用：
// 行程裡任何成員都能寫資料，不能假設欄位一定是數字或字串（否則壞資料可能讓畫面壞掉，或被塞進惡意內容）。
const str = (v, max = 200) => (typeof v === 'string' ? v : v == null ? '' : String(v)).slice(0, max);
const fin = v => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : 0; };
const sid = v => { const t = str(v, 128); return ['__proto__', 'constructor', 'prototype'].includes(t) ? '' : t; };
const ccy = (v, fb) => typeof v === 'string' && /^[A-Z]{3}$/.test(v) ? v : fb;
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
function cleanGroup(g) {
  if (!g) return g;
  const members = {};
  for (const [id, m] of Object.entries(obj(g.members))) if (sid(id) && m && typeof m === 'object')
    members[id] = { name: str(m.name, 40).trim() || '旅伴', photo: /^https:\/\//.test(m.photo) ? str(m.photo, 500) : '', guest: !!m.guest, left: !!m.left, removed: !!m.removed, joinedAt: fin(m.joinedAt) };
  const base = ccy(g.base, 'TWD');
  return { id: str(g.id), name: str(g.name, 60).trim() || '未命名行程', base, tripCur: ccy(g.tripCur, base), ownerUid: str(g.ownerUid), inviteCode: str(g.inviteCode, 80), createdAt: fin(g.createdAt),
    memberUids: (Array.isArray(g.memberUids) ? g.memberUids : []).filter(x => typeof x === 'string'), members };
}
function cleanExpense(e) {
  const o = { id: str(e.id), kind: e.kind === 'transfer' ? 'transfer' : 'expense', date: typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) ? e.date : '',
    amount: Math.max(0, fin(e.amount)), baseAmount: Math.max(0, fin(e.baseAmount)), currency: ccy(e.currency, S.group?.base || 'TWD'), rate: fin(e.rate) > 0 ? fin(e.rate) : 1,
    createdBy: sid(e.createdBy), createdAt: fin(e.createdAt), updatedAt: fin(e.updatedAt) };
  if (o.kind === 'transfer') return { ...o, from: sid(e.from), to: sid(e.to) };
  const sp = obj(e.split);
  const split = sp.mode === 'custom'
    ? { mode: 'custom', shares: Object.fromEntries(Object.entries(obj(sp.shares)).map(([k, v]) => [sid(k), fin(v)]).filter(([k, v]) => k && v > 0)) }
    : { mode: 'equal', ids: [...new Set((Array.isArray(sp.ids) ? sp.ids : []).map(sid).filter(Boolean))] };
  const items = (Array.isArray(e.items) ? e.items : []).slice(0, 40).filter(it => it && typeof it === 'object').map(it => {
    const x = { name: str(it.name, 60) }; if (it.orig) x.orig = str(it.orig, 60); if (fin(it.qty) > 0) x.qty = fin(it.qty); if (it.amount != null && Number.isFinite(+it.amount)) x.amount = +it.amount; return x; });
  return { ...o, title: str(e.title, 60).trim() || '未命名', payer: sid(e.payer), split, category: Object.hasOwn(CATS, e.category) ? e.category : 'other', note: str(e.note, 120), hasReceipt: !!e.hasReceipt, ai: !!e.ai, items };
}
const memberList = () => Object.entries(S.group?.members || {}).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
const activeMembers = () => memberList().filter(m => !m.left);
const mName = id => { const m = S.group?.members?.[id]; return m ? m.name : '已移除的成員'; };
const hue = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 6; };
const avatar = (id, m, cls = '') => `<span class="av ${cls} h${hue(id)}" aria-hidden="true">${m?.photo ? `<img src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer">` : esc(String(m?.name || '?').trim().slice(0, 1))}</span>`;

// 一筆帳每個人該分攤多少（結算幣別）。不論哪種分法，加起來一定等於這筆帳的金額。
function sharesOf(e) {
  const out = {}, b = e.baseAmount || 0;
  if (e.split?.mode === 'custom') {
    const ent = Object.entries(e.split.shares || {}).map(([id, v]) => [id, +v || 0]).filter(([, v]) => v > 0), sum = ent.reduce((t, [, v]) => t + v, 0);
    if (sum > 0) for (const [id, v] of ent) out[id] = b * v / sum;        // 按各自金額的比例分
  } else { const ids = [...new Set(e.split?.ids || [])]; ids.forEach(id => out[id] = b / ids.length); }
  if (!Object.keys(out).length && e.payer) out[e.payer] = b;               // 沒有分攤對象的壞資料：算付款人自己的，不會憑空多出錢
  return out;
}
// 把一組加總為零的數字四捨五入成整數，並保證捨入後加總仍然是零（尾差給捨入誤差最大的人）。
function zeroSumRound(xs) {
  const r = xs.map(x => Math.round(x)), diff = r.reduce((a, b) => a + b, 0);
  if (!diff || Math.abs(xs.reduce((a, b) => a + b, 0)) > 0.5) return r;
  const sg = Math.sign(diff), order = xs.map((x, i) => [(r[i] - x) * sg, i]).sort((p, q) => q[0] - p[0] || p[1] - q[1]);
  for (let k = 0; k < Math.abs(diff); k++) r[order[k % order.length][1]] -= sg;
  return r;
}
function compute() {
  const net = {}, gross = {}, paid = {}, owed = {}, byCat = {}, byDay = {}, byCur = {}, moved = {};
  const add = (o, k, v) => { o[k] = (o[k] || 0) + v; };
  memberList().forEach(m => { gross[m.id] = 0; paid[m.id] = 0; owed[m.id] = 0; });
  const P = 10 ** dec(S.group?.base);            // 結算幣別的最小單位：TWD、JPY 是 1 元，USD 是 0.01
  let total = 0, count = 0;
  for (const e of S.expenses) {
    const b = e.baseAmount || 0;
    if (e.kind === 'transfer') { const t = Math.round(b * P); add(moved, e.from, t); add(moved, e.to, -t); add(gross, e.from, 0); add(gross, e.to, 0); continue; }
    total += b; count++;
    add(paid, e.payer, b); add(gross, e.payer, b);
    for (const [id, v] of Object.entries(sharesOf(e))) { add(owed, id, v); add(gross, id, -v); }
    add(byCat, e.category || 'other', b); add(byDay, e.date, b); add(byCur, e.currency, e.amount || 0);
  }
  // gross：記帳算出來的淨額；net：扣掉已經還款之後還剩多少。兩者都是最小單位的整數倍，而且各自加總為零，
  // 所以照建議付完一定剛好結清，不會剩下 1 元對不起來。
  const ids = Object.keys(gross), G = zeroSumRound(ids.map(id => gross[id] * P));
  ids.forEach((id, i) => { gross[id] = G[i] / P; net[id] = (G[i] + (moved[id] || 0)) / P; });
  return { net, gross, paid, owed, total, count, byCat, byDay, byCur };
}
function settle(net, d) {
  const eps = d === 0 ? 0.5 : 0.005, cred = [], debt = [], out = [];
  for (const [id, v] of Object.entries(net)) { if (v > eps) cred.push({ id, v }); else if (v < -eps) debt.push({ id, v: -v }); }
  cred.sort((a, b) => b.v - a.v); debt.sort((a, b) => b.v - a.v);
  let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const x = Math.min(debt[i].v, cred[j].v), amt = roundTo(x, d);
    if (amt > 0) out.push({ from: debt[i].id, to: cred[j].id, amount: amt });
    debt[i].v -= x; cred[j].v -= x;
    if (debt[i].v <= eps) i++;
    if (j < cred.length && cred[j].v <= eps) j++;
  }
  return out;
}

const dayLabel = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : new Intl.DateTimeFormat('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' }).format(d); };

  }).join('')}</div>`).join('');

function settleRows(c, d) {
  const order = Object.fromEntries(memberList().map((m, i) => [m.id, i])), o = id => order[id] ?? 999;
  const done = S.expenses.filter(e => e.kind === 'transfer').map(e => ({ id: e.id, from: e.from, to: e.to, amount: e.baseAmount || 0, date: e.date, paid: true, at: e.createdAt || 0 }));
  const open = settle(c.net, d).map(p => ({ ...p, paid: false, at: Infinity }));
  return [...done, ...open].sort((x, y) => o(x.from) - o(y.from) || o(x.to) - o(y.to) || x.at - y.at);
}
// 每個人的狀態：淨額保留記帳算出來的原始數字，還款之後只改狀態
function netStatus(c, id, base) {
  const d = dec(base), eps = d ? 0.005 : 0.5, v = c.gross[id] || 0, rem = c.net[id] || 0;
  if (Math.abs(rem) < eps) return { v, rem, settled: true, text: '結清' };
  const partial = Math.abs(rem - v) >= eps;
  return { v, rem, settled: false, text: partial ? `${rem > 0 ? '還要收' : '還要付'} ${fmt(Math.abs(rem), base)}` : rem > 0 ? '應收' : '應付' };
}
function tabSettle(g, c) {
  const d = dec(g.base), eps = d ? 0.005 : 0.5, rows = settleRows(c, d), left = rows.filter(r => !r.paid).length;
  const max = Math.max(1, ...Object.values(c.gross).map(Math.abs));
  const ms = memberList().filter(m => !m.left || Math.abs(c.gross[m.id] || 0) > eps || Math.abs(c.net[m.id] || 0) > eps);
  return `<section class="panel"><h2>誰該付給誰</h2>

        ${p.paid ? `<button class="btn ghost small" data-act="unpay" data-id="${esc(p.id)}">取消已付</button>`
                 : `<button class="btn small" data-act="pay" data-from="${esc(p.from)}" data-to="${esc(p.to)}" data-amt="${p.amount}">記為已付</button>`}</div>`).join('')
      : `<p style="color:var(--ink2)">${c.count ? '大家花的剛好一樣多，不用互相付錢。' : '記了帳之後，這裡會算出最少次數的轉帳方式。'}</p>`}
      ${rows.length && !left ? '<p class="allclear">全部付清了，大家都結清。</p>' : ''}
      <p class="hint">以 ${esc(g.base)} 結算，每筆帳用記帳當下的匯率換算。按錯了可以直接取消已付。</p></section>
    <section class="panel"><h2>每個人的淨額</h2>
      ${ms.map(m => { const st = netStatus(c, m.id, g.base), v = st.v, w = Math.abs(v) / max * 50, zero = Math.abs(v) < eps; return `<div class="net ${st.settled ? 'settled' : ''}"><span class="nm">${esc(m.name)}</span>
        <span class="track">${zero ? '' : `<span class="fill ${v > 0 ? 'pos' : 'neg'}" style="width:${w.toFixed(1)}%"></span>`}</span>
        <span class="v num ${zero ? '' : v > 0 ? 'pos' : 'neg'}">${zero ? fmt(0, g.base) : (v > 0 ? '+' : '−') + fmt(Math.abs(v), g.base)}<small class="${st.settled ? 'ok' : ''}">${esc(st.text)}</small></span></div>`; }).join('')}
      <p class="hint">綠色是該收回的錢，紅色是該付出的錢。還款之後數字會留著，狀態變成結清。</p></section>`;
}

function tabStats(g, c) {
  if (!c.count) return `<div class="empty">${mascot(128)}<b>還沒有資料</b>開始記帳後，這裡會顯示分類、每日和每個人的花費。</div>`;
  const n = Math.max(1, activeMembers().length);
  const cats = Object.entries(c.byCat).sort((a, b) => b[1] - a[1]), cmax = Math.max(1, ...cats.map(x => x[1]));
  const days = Object.entries(c.byDay).sort((a, b) => a[0] < b[0] ? -1 : 1), dmax = Math.max(1, ...days.map(x => x[1]));
  const pmax = Math.max(1, ...memberList().map(m => Math.max(c.paid[m.id] || 0, c.owed[m.id] || 0)));
  const short = v => v >= 10000 ? (v / 10000).toFixed(1) + '萬' : Math.round(v).toLocaleString('zh-TW');
  return `<div class="figs">
      <div class="fig"><span>每人平均</span><b class="num">${fmt(c.total / n, g.base)}</b></div>
      <div class="fig"><span>平均每天</span><b class="num">${fmt(c.total / Math.max(1, days.length), g.base)}</b></div>
      <div class="fig"><span>筆數</span><b class="num">${c.count}</b></div></div>

/* =====================================================================
   收據照片與辨識
   ===================================================================== */
async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { } }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); }; im.src = u; });
}
function draw(src, max) { const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height); return c; }
const dataUrlToBlob = u => { const [h, b] = u.split(','), bin = atob(b), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: /:(.*?);/.exec(h)?.[1] || 'image/jpeg' }); };
async function prepareImage(file) {
  const bmp = await loadBitmap(file);
  const ocr = draw(bmp, 1600).toDataURL('image/jpeg', 0.82);
  let keep = draw(bmp, 1000).toDataURL('image/jpeg', 0.6);
  if (keep.length > 700000) keep = draw(bmp, 760).toDataURL('image/jpeg', 0.5);   // Firestore 單一文件上限 1 MiB
  return { ocr, keep };
}
function ocrPrompt() {
  const g = S.group;

const loadScript = src => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(Object.assign(new Error('load'), { code: 'load' })); document.head.appendChild(el); });

// 手機上瀏覽器的列印常常沒有反應，所以直接在頁面裡把報表做成 PDF 檔。
async function exportPdf() {
  if (!S.group) return;
  const name = `${safeName(S.group.name)}_分帳報表_${ymd()}.pdf`;
  openSheet({ type: 'pdf', state: 'build', msg: '載入製作工具' });
  const my = sheet, step = m => { if (sheet === my) { my.msg = m; renderSheet(); } };
  let stage;
  try {
    if (!window.html2canvas) await loadScript('lib-html2canvas.min.js').catch(() => loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'));
    if (!window.jspdf) await loadScript('lib-jspdf.umd.min.js').catch(() => loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'));
    stage = document.createElement('div'); stage.id = 'pdfstage'; stage.className = 'report'; stage.innerHTML = reportHtml(); document.body.appendChild(stage);
    try { await document.fonts.ready; } catch { }
    await new Promise(r => setTimeout(r, 80));
    step('繪製報表');
    const W = stage.offsetWidth, H = stage.scrollHeight, top0 = stage.getBoundingClientRect().top;
    // 可以換頁的位置：每一列、每個標題的上緣（表格的第一列不算，免得標題和內容被拆開）
    const cuts = [...stage.querySelectorAll('tbody tr:not(:first-child), tfoot tr, h2, p, .kpi')].map(el => el.getBoundingClientRect().top - top0).filter(v => v > 0).sort((x, y) => x - y);
    const scale = Math.max(1, Math.min(2, Math.sqrt(12e6 / (W * H))));   // iPhone 的畫布面積有上限
    const canvas = await window.html2canvas(stage, { scale, backgroundColor: '#ffffff', logging: false });
    const pageH = W * 273 / 186, pages = [];
    for (let y = 0; y < H - 1;) { let end = y + pageH; if (end < H) { const c = cuts.filter(v => v <= end && v > y + pageH * 0.4).pop(); if (c) end = c; } else end = H; pages.push([y, end]); y = end; }
    step('組成 PDF');
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' }), k = canvas.width / W;
    pages.forEach(([a, b], i) => {
      const pc = document.createElement('canvas'); pc.width = canvas.width; pc.height = Math.max(1, Math.round((b - a) * k));
      const cx = pc.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, pc.width, pc.height); cx.drawImage(canvas, 0, Math.round(a * k), pc.width, pc.height, 0, 0, pc.width, pc.height);
      if (i) doc.addPage();

      doc.setFontSize(9); doc.setTextColor(120); doc.text(`${i + 1} / ${pages.length}`, 198, 289, { align: 'right' });
    });
    const blob = doc.output('blob'), file = new File([blob], name, { type: 'application/pdf' });
    if (sheet !== my) return;
    Object.assign(my, { state: 'ready', name, file, url: URL.createObjectURL(blob), pages: pages.length, canShare: canShareFile(file) }); renderSheet();
  } catch (e) {
    console.error('PDF 製作失敗', e);
    if (sheet === my) { my.state = 'fail'; my.msg = e?.code === 'load' ? '製作 PDF 的工具載入不了，請確認網路連線後再試一次。' : '這份報表沒辦法在這個瀏覽器裡做成 PDF。'; renderSheet(); }
  } finally { stage?.remove(); }
}

}
function leaveGroupView() { unsubGroup?.(); unsubExp?.(); unsubGroup = unsubExp = null; }
function goHome() { leaveGroupView(); closeSheet(); S.gid = null; S.group = null; S.expenses = []; render(); }

function saveExpense() {
  const g = S.group, a = num(F.amount), r = F.currency === g.base ? 1 : num(F.rate);
  if (!(a > 0)) return fail('請輸入金額。');
  if (!(r > 0)) return fail('請輸入匯率。');
  if (!F.payer) return fail('請選誰先付的。');
  const ref = F.currency === g.base ? null : rateOf(F.currency, g.base);
  if (ref && (r / ref > 1.5 || r / ref < 1 / 1.5) && !confirm(`這筆的匯率是 1 ${F.currency} = ${r} ${g.base}，和目前行情（約 ${fmtRate(ref)}）差很多。\n\n確定要用這個匯率嗎？`)) return;
  let split;
  if (F.mode === 'equal') { if (!F.ids.size) return fail('至少選一個人分攤。'); split = { mode: 'equal', ids: [...F.ids] }; }
  else {
    const shares = {}; for (const m of memberList()) { const v = num(F.shares[m.id]); if (v > 0) shares[m.id] = v; }
    const sum = Object.values(shares).reduce((t, v) => t + v, 0);
    if (Math.abs(sum - a) >= tol(F.currency)) return fail(`各自金額加起來是 ${fmt(sum, F.currency)}，和總金額 ${fmt(a, F.currency)} 不一樣。`);
    split = { mode: 'custom', shares };
  }
  const now = Date.now();
  const hasReceipt = F.receiptChanged ? !!F.receipt : F.hasReceipt;
  const data = { kind: 'expense', title: F.title.trim() || CATS[F.category][1], amount: a, currency: F.currency, rate: r, baseAmount: roundTo(a * r, 2), payer: F.payer, split, date: F.date || ymd(), category: F.category, note: F.note.trim(), hasReceipt, ai: F.ai.size > 0,
    items: F.items.map(it => { const o = { name: it.name.trim().slice(0, 60) }, a = num(it.amount); if (Number.isFinite(a)) o.amount = a; if (it.orig) o.orig = it.orig; if (it.qty > 0) o.qty = it.qty; return o; }).filter(o => o.name || o.amount != null).slice(0, 40),
    createdBy: F.createdBy || S.user.uid, createdAt: F.createdAt || now, updatedAt: now };
  store.saveExpense(S.gid, F.id, data, F.receiptChanged ? (F.receipt || null) : undefined);
  toast(F.id ? '已儲存修改' : '已記下這筆'); closeSheet();
  function fail(m) { F.err = m; renderSheet(); $('.sheet-body', sheetEl).scrollTop = 0; }
}

async function openExpense(id) {
  const e = S.expenses.find(x => x.id === id); if (!e) return;
  if (e.kind === 'transfer') return openSheet({ type: 'transfer', id: e.id, from: e.from, to: e.to, amount: String(e.baseAmount), date: e.date, createdAt: e.createdAt });
  F = newForm(e); openSheet({ type: 'expense' });
  if (e.hasReceipt) { const my = F; try { const img = await store.getReceipt(S.gid, id); if (F === my && typeof img === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(img) && my.receipt === undefined) { my.receipt = img; renderSheet(); } } catch { } }
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'backdrop') { if (ev.target === el && sheet?.type !== 'expense') closeSheet(); return; }
  switch (act) {
    case 'signin': S.loginErr = ''; try { await store.signIn(); } catch (e) { console.error(e); S.loginErr = /unauthorized-domain/.test(e?.code || '') ? '這個網址還沒加進 Firebase 的授權網域。' : '登入沒有成功，請再試一次。'; render(); } break;
    case 'signout': if (!navigator.onLine && !confirm('目前沒有網路。登出會清掉這台裝置上的資料，還沒同步的帳目會不見。\n\n確定要登出嗎？')) break;
      closeSheet(); leaveGroupView(); unsubGroups?.(); await store.signOut(); break;
    case 'user-menu': openSheet({ type: 'user' }); break;
    case 'demo-reset': store.reset(); toast('已重設範例資料'); break;
    case 'open-group': openGroup(el.dataset.id); break;
    case 'back': goHome(); break;
    case 'tab': S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'sheet-close': closeSheet(); break;
    case 'new-group': openSheet({ type: 'group' }); break;
    case 'save-group': {
      const name = $('#n-name').value.trim(), me = $('#n-me').value.trim() || S.user.name;
      Object.assign(sheet, { name, me, tripCur: $('#n-trip').value, base: $('#n-base').value });
      if (!name) { sheet.err = '請幫行程取個名字。'; renderSheet(); break; }
      el.disabled = true; el.textContent = '建立中…';
      try {
        const gid = await store.createGroup({ name, base: sheet.base, tripCur: sheet.tripCur, ownerUid: S.user.uid, memberUids: [S.user.uid], inviteCode: rid(20), createdAt: Date.now(),
          members: { [S.user.uid]: { name: me, photo: S.user.photo || '', joinedAt: Date.now() } } });
        closeSheet(); openGroup(gid);
      } catch (e) {
        console.error(e);
        if (sheet?.type === 'group') { sheet.err = e?.code === 'permission-denied' ? '建立行程被拒絕（沒有權限）。請確認 Firestore 安全規則已經發布。' : `建立行程沒有成功（${e?.code || '連線問題'}）。`; renderSheet(); }
      }
      break;
    }
    case 'add-cam': $('#cam').click(); break;
    case 'add-pick': $('#pick').click(); break;
    case 'add-manual': F = newForm(null); openSheet({ type: 'expense' }); break;
    case 'edit-exp': openExpense(el.dataset.id); break;
    case 'f-cat': F.category = el.dataset.v; F.touched.add('category'); F.ai.delete('category'); renderSheet(); break;
    case 'f-mode': F.mode = el.dataset.v; if (F.mode === 'custom' && !Object.keys(F.shares).length) { const a = num(F.amount); if (a > 0 && F.ids.size) { const parts = evenParts(a, F.ids.size, F.currency); [...F.ids].forEach((id, i) => F.shares[id] = String(parts[i])); } } renderSheet(); break;
    case 'f-toggle': F.ids.has(el.dataset.v) ? F.ids.delete(el.dataset.v) : F.ids.add(el.dataset.v); renderSheet(); break;
    case 'f-rate-live': { const ok = await loadRates(true); if (!F) break; const r = rateOf(F.currency, S.group.base); if (r) { F.rate = String(r); F.rateManual = false; F.touched.delete('rate'); } renderSheet(); toast(ok ? '已更新匯率' : '抓不到即時匯率，先用手邊的數字'); break; }
    case 'f-view': { const v = document.createElement('div'); v.className = 'viewer'; v.innerHTML = `<img src="${esc(F.receipt)}" alt="收據照片">`; v.onclick = () => v.remove(); document.body.appendChild(v); break; }
    case 'f-rescan': runOcr(); break;
    case 'f-remove-receipt': F.receipt = null; F.receiptChanged = true; F.ocrSrc = null; F.ocr = 'idle'; renderSheet(); break;
    case 'f-item-add': F.items.push({ name: '', orig: '', qty: 0, amount: '' }); F.touched.add('items'); renderSheet(); $(`#f-it-n-${F.items.length - 1}`)?.focus(); break;
    case 'f-item-del': F.items.splice(+el.dataset.i, 1); F.touched.add('items'); if (!F.items.length) F.ai.delete('items'); renderSheet(); break;
    case 'export-pdf': exportPdf(); break;
    case 'pdf-print': closeSheet(); printReport(); break;
    case 'pdf-share': try { await navigator.share({ files: [sheet.file], title: sheet.name }); } catch (e) { if (e?.name !== 'AbortError') toast('分享沒有成功，請改按「下載 PDF」'); } break;
    case 'export-csv': exportCsv(); break;
    case 'f-save': saveExpense(); break;
    case 'f-delete': if (confirm('確定刪除這筆帳目？')) { store.deleteExpense(S.gid, F.id); closeSheet(); toast('已刪除'); } break;
    case 'pay': { const now = Date.now(), amt = +el.dataset.amt; if (!(amt > 0)) break;
      store.saveExpense(S.gid, null, { kind: 'transfer', from: el.dataset.from, to: el.dataset.to, amount: amt, currency: S.group.base, rate: 1, baseAmount: amt, date: ymd(), createdBy: S.user.uid, createdAt: now, updatedAt: now });
      toast('已記為已付'); break; }
    case 'unpay': store.deleteExpense(S.gid, el.dataset.id); toast('已取消已付'); break;
    case 't-save': {
      const from = $('#t-from').value, to = $('#t-to').value, amt = num($('#t-amt').value), date = $('#t-date').value || ymd();
      Object.assign(sheet, { from, to, amount: $('#t-amt').value, date });
      if (from === to) { sheet.err = '付款人和收款人不能是同一位。'; renderSheet(); break; }
      if (!(amt > 0)) { sheet.err = '請輸入金額。'; renderSheet(); break; }
      const now = Date.now();
      store.saveExpense(S.gid, sheet.id, { kind: 'transfer', from, to, amount: amt, currency: S.group.base, rate: 1, baseAmount: amt, date, createdBy: S.user.uid, createdAt: sheet.createdAt || now, updatedAt: now });
      closeSheet(); toast('已記為已付'); break;
    }
    case 't-delete': if (confirm('確定刪除這筆還款？')) { store.deleteExpense(S.gid, sheet.id); closeSheet(); toast('已刪除'); } break;
    case 'invite': openSheet({ type: 'invite' }); break;
    case 'copy-link': { const inp = $('#inv-url'); try { await navigator.clipboard.writeText(inp.value); toast('已複製連結'); } catch { inp.focus(); inp.select(); toast('請長按連結複製'); } break; }
    case 'share-link': try { await navigator.share({ title: `一起分帳：${S.group.name}`, text: `加入「${S.group.name}」一起記帳分帳`, url: inviteUrl() }); } catch { } break;
    case 'reset-code': if (confirm('換新連結後，舊連結會失效。已加入的旅伴不受影響。')) { await store.updateGroup(S.gid, { inviteCode: rid(20) }); toast('已換成新連結'); setTimeout(renderSheet, 400); } break;
    case 'add-guest': openSheet({ type: 'guest' }); setTimeout(() => $('#gu-name')?.focus(), 50); break;
    case 'save-guest': { const n = $('#gu-name').value.trim(); if (!n) { sheet.err = '請輸入名字。'; renderSheet(); break; } store.setMember(S.gid, 'g_' + rid(8), { name: n, guest: true, joinedAt: Date.now() }); closeSheet(); toast(`已加入 ${n}`); break; }
    case 'remove-member': if (confirm('把這個名字從名單移除？')) store.removeMember(S.gid, el.dataset.id); break;
    case 'kick-member': {
      const id = el.dataset.id, used = !!el.dataset.used, nm = mName(id);
      if (S.group.ownerUid !== S.user.uid || id === S.user.uid) break;
      if (!confirm(used ? `把「${nm}」移出行程？\n\n他之後就打不開這個行程了。他的帳目和該付、該收的金額都會保留，名字會標成「已移出」。\n舊的邀請連結也會一起失效。`
                        : `把「${nm}」移出行程？\n\n他沒有任何帳目，名字會從名單上整個清除。\n舊的邀請連結也會一起失效。`)) break;
      try { await store.kickMember(S.gid, id, !used, rid(20)); toast(`已移出 ${nm}，邀請連結已換新`); }
      catch (e) { console.error(e); toast(e?.code === 'permission-denied' ? '移出被拒絕（沒有權限），請確認新的安全規則已經發布' : `移出沒有成功（${e?.code || '連線問題'}）`); }
      break;
    }
    case 'settings-save': { const name = $('#g-name').value.trim(); if (!name) { toast('行程名稱不能空白'); break; } const patch = { name, tripCur: $('#g-trip').value }; if (!S.expenses.length) patch.base = $('#g-base').value; store.updateGroup(S.gid, patch); toast('已儲存設定'); break; }
    case 'leave-group': if (confirm('退出後就看不到這個行程了，帳目會保留給其他人。確定退出？')) { const gid = S.gid; goHome(); store.leaveGroup(gid); } break;
    case 'delete-group': if (confirm(`刪除「${S.group.name}」和裡面所有帳目？這個動作無法復原。`)) { const gid = S.gid; goHome(); try { await store.deleteGroup(gid); toast('已刪除行程'); } catch (e) { console.error(e); toast('刪除沒有完成，請再試一次'); } } break;
  }
});

// 表單輸入：只更新資料與局部文字，不重畫整張表單（避免輸入到一半失去焦點）
sheetEl.addEventListener('input', ev => {
  const t = ev.target; if (!F || sheet?.type !== 'expense') return;
  const unmark = k => { F.touched.add(k); if (F.ai.delete(k)) t.closest('.field')?.classList.remove('ai'); };
  if (t.dataset.item != null) { const it = F.items[+t.dataset.item]; if (!it) return; it[t.dataset.k] = t.value; F.touched.add('items'); if (F.ai.delete('items')) t.closest('.field')?.classList.remove('ai'); const el = $('#f-items-sum'); if (el) el.textContent = itemsSumText(); return; }
  if (t.dataset.share) { F.shares[t.dataset.share] = t.value; const r = $('#f-remain'); if (r) { const x = remainText(); r.textContent = x.text; r.classList.toggle('bad', !x.ok); } return; }
  switch (t.id) {
    case 'f-amount': F.amount = t.value; unmark('amount'); break;
    case 'f-title': F.title = t.value; unmark('title'); return;
    case 'f-note': F.note = t.value; return;
    case 'f-rate': F.rate = t.value; F.rateManual = true; F.touched.add('rate'); break;
    default: return;
  }
  const g = S.group, a = num(F.amount), r = num(F.rate), ap = $('#f-approx'), ea = $('#f-each'), re = $('#f-remain');
  if (ap) ap.innerHTML = a > 0 && r > 0 ? `　≈ <b class="num">${fmt(a * r, g.base)}</b>` : '';
  if (ea) ea.textContent = eachText();
  const isum = $('#f-items-sum'); if (isum && F.items.length) isum.textContent = itemsSumText();
  if (re) { const x = remainText(); re.textContent = x.text; re.classList.toggle('bad', !x.ok); }
});
sheetEl.addEventListener('change', ev => {
  const t = ev.target; if (!F || sheet?.type !== 'expense') return;
  if (t.id === 'f-currency') { F.currency = t.value; F.touched.add('currency'); F.ai.delete('currency'); F.rate = String(rateOf(F.currency, S.group.base) || 1); F.rateManual = false; F.touched.delete('rate'); renderSheet(); }
  else if (t.id === 'f-date') { F.date = t.value; F.touched.add('date'); if (F.ai.delete('date')) t.closest('.field')?.classList.remove('ai'); }
  else if (t.id === 'f-payer') F.payer = t.value;
});
for (const id of ['cam', 'pick']) $('#' + id).addEventListener('change', ev => { const f = ev.target.files?.[0]; ev.target.value = ''; startFromPhoto(f); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { const v = $('.viewer'); if (v) v.remove(); else if (sheet) closeSheet(); } });

/* =====================================================================
   啟動
   ===================================================================== */
captureInvite();
loadRates();
try { store = CONFIGURED ? await cloudStore() : demoStore(); }
catch (e) { console.error('Firebase 載入失敗，改用試用模式', e); store = demoStore(); toast('連不上 Firebase，暫時用試用模式'); }
store.onUser(u => {
  unsubGroups?.(); unsubGroups = null; leaveGroupView();
  S.user = u; S.ready = true; S.gid = null; S.group = null; S.groups = []; S.expenses = [];
  if (u) { unsubGroups = store.watchGroups(list => { S.groups = list.map(cleanGroup); if (!S.gid) render(); }); tryJoin(); }
  render();
});
</script>
</body>
</html>
